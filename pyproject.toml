[build-system]
# Should be mirrored in requirements/build/cuda.txt
requires = [
    "cmake>=3.26.1",
    "ninja",
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "setuptools-scm>=8.0",
    "setuptools-rust>=1.9.0",
    "torch == 2.11.0",
    "wheel",
    "jinja2",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm"
authors = [{name = "vLLM Team"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "A high-throughput and memory-efficient inference and serving engine for LLMs"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.13,<3.14"
dynamic = ["version"]

# Core dependencies (from common.txt + rocm.txt)
dependencies = [
    # PyTorch ROCm 7.14 ecosystem. The gfx1201 extras pull the matching
    # runtime, and torch pulls the matching ROCm Triton transitively.
    "torch[device-gfx1201]==2.12.0+rocm7.14.0",
    "torchvision[device-gfx1201]==0.27.0+rocm7.14.0",
    "torchaudio==2.11.0+rocm7.14.0",

    # Core ML/inference
    "transformers==5.12.1",
    "tokenizers>=0.21.1",
    "accelerate",
    "peft",
    "einops",
    "safetensors",
    "sentencepiece",
    "tiktoken>=0.6.0",
    "gguf>=0.17.0",
    "timm>=1.0.17",

    # Structured generation
    "lm-format-enforcer==0.11.3",
    "llguidance>=1.3.0,<1.4.0",
    "outlines_core==0.2.11",
    "xgrammar==0.1.29",
    "lark==1.2.2",

    # API/serving
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.12.0",
    "aiohttp",
    "openai>=1.99.1",
    "anthropic>=0.71.0",
    "openai-harmony>=0.0.3",
    "grpcio",
    "grpcio-reflection",
    "grpcio-tools>=1.76.0",
    "mcp",

    # Monitoring
    "prometheus_client>=0.18.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Media processing
    "pillow",
    "opencv-python-headless>=4.13.0",
    "qwen-vl-utils==0.0.14",

    # Data/serialization
    "numpy",
    "protobuf",
    "msgspec",
    "pyyaml",
    "cbor2",
    "ijson",

    # Utilities
    "regex",
    "cachetools",
    "psutil",
    "requests>=2.26.0",
    "tqdm",
    "blake3",
    "py-cpuinfo",
    "typing_extensions>=4.10",
    "filelock>=3.16.1",
    "partial-json-parser",
    "pyzmq>=25.0.0",
    "cloudpickle",
    "watchfiles",
    "python-json-logger",
    "pybase64",
    "setproctitle",
    "diskcache==5.6.3",
    "compressed-tensors==0.13.0",
    "depyf==0.20.0",
    "ninja",
    "packaging>=24.2",
    "setuptools>=77.0.3,<81.0.0",
    "six>=1.16.0",

    # Mistral
    "mistral_common[image,soundfile]>=1.9.0",

    # Model hosting
    "model-hosting-container-standards>=0.1.13,<1.0.0",

    # ROCm-specific
    "amdsmi",
    "numba==0.61.2",
    "datasets>=4.0",
    "ray[cgraph]>=2.48.0",
    "pytest-asyncio",
    "tensorizer==2.10.1",
    "setuptools-scm>=8",
    "conch-triton-kernels==1.3",
]

[project.urls]
Homepage="https://github.com/vllm-project/vllm"
Documentation="https://docs.vllm.ai/en/latest/"
Slack="https://slack.vllm.ai/"

[project.scripts]
vllm = "vllm.entrypoints.cli.main:main"

[project.entry-points."vllm.general_plugins"]
lora_filesystem_resolver = "vllm.plugins.lora_resolvers.filesystem_resolver:register_filesystem_resolver"
lora_hf_hub_resolver = "vllm.plugins.lora_resolvers.hf_hub_resolver:register_hf_hub_resolver"

[tool.setuptools_scm]
# no extra settings needed, presence enables setuptools-scm

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm*"]

[tool.ruff.lint.per-file-ignores]
"vllm/third_party/**" = ["ALL"]
"vllm/version.py" = ["F401"]
"vllm/_version.py" = ["ALL"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[tool.pytest.ini_options]
markers = [
    "slow_test",
    "skip_global_cleanup",
    "core_model: enable this model test in each PR instead of only nightly",
    "hybrid_model: models that contain mamba layers (including pure SSM and hybrid architectures)",
    "cpu_model: enable this model test in CPU tests",
    "cpu_test: mark test as CPU-only test",
    "split: run this test as part of a split",
    "distributed: run this test only in distributed GPU tests",
    "optional: optional tests that are automatically skipped, include --optional to run them",
]

[tool.ty.src]
respect-ignore-files = true

[tool.ty.environment]
python = "./.venv"

[tool.typos.files]
# these files may be written in non english words
extend-exclude = ["tests/models/fixtures/*", "tests/prompts/*", "tests/tokenizers_/*",
    "benchmarks/sonnet.txt", "rust/src/bench/src/datasets/sonnet.txt",
    "tests/lora/data/*", "build/*",
    "examples/pooling/token_embed/*", "tests/models/language/pooling/*",
    "vllm/third_party/*", "vllm/entrypoints/serve/instrumentator/static/*",
    "tests/entrypoints/speech_to_text/transcription/test_transcription_validation.py",
    "docs/governance/process.md", "docs/assets/contributing/vllm_bench_serve_timeline.html", 
    "tests/v1/engine/test_fast_incdec_prefix_err.py", ".git/*", "csrc/cpu/sgl-kernels/*",
    "rust/src/chat/src/renderer/deepseek_v32/fixtures/*",
    "rust/src/parser/src/tool/gemma4.rs", "rust/src/parser/src/unified/gemma4.rs",
    "rust/src/text/src/output/decoded.rs",
    "rust/src/tokenizer/src/incremental.rs", "rust/src/parser/src/reasoning/tests.rs"]
ignore-hidden = false

[tool.typos.default]
extend-ignore-identifiers-re = [".*[Uu][Ee][0-9][Mm][0-9].*"]

[tool.typos.default.extend-identifiers]
bbc5b7ede = "bbc5b7ede"
NOOPs = "NOOPs"
nin_shortcut = "nin_shortcut"
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"
sharedMemPerBlockOptin = "sharedMemPerBlockOptin"

depthwise_seperable_out_channel = "depthwise_seperable_out_channel"
pard_token = "pard_token"
ptd_token_id = "ptd_token_id"
ser_de = "ser_de"
shared_memory_per_block_optin = "shared_memory_per_block_optin"
FoPE = "FoPE"
k_ot = "k_ot"
view_seperator = "view_seperator"
inverse_std_variences = "inverse_std_variences"

[tool.typos.default.extend-words]
iy = "iy"
indx = "indx"
# intel cpu features
tme = "tme"
dout = "dout"
Pn = "Pn"
arange = "arange"
thw = "thw"
# temporal position ids (parallels hpos/wpos in vision RoPE)
tpos = "tpos"
subtile = "subtile"
HSA = "HSA"
setp = "setp"
CPY = "CPY"
thr = "thr"
Thr = "Thr"
PARD = "PARD"
pard = "pard"
AKS = "AKS"
ba = "ba"
fo = "fo"
nd = "nd"
eles = "eles"
datas = "datas"
ser = "ser"
ure = "ure"
VALU = "VALU"
# Walsh-Hadamard Transform
wht = "wht"
WHT = "WHT"
# Huawei Compute Architecture for Neural Networks
CANN = "CANN"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
index-strategy = "unsafe-best-match"
package = true
no-build-isolation-package = ["torch", "torchvision", "vllm"]

# AMD ROCm 7.14 multi-architecture wheels. The non-explicit index lets
# torch resolve its ROCm Triton and gfx1201 runtime dependencies here.
[[tool.uv.index]]
name = "rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"

[tool.uv.sources]
torch = { index = "rocm" }
torchvision = { index = "rocm" }
torchaudio = { index = "rocm" }
