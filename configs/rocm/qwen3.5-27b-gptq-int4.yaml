# Qwen3.5-27B (GPTQ Int4) — hybrid DeltaNet+Attention dense model
# Usage: ./run-vllm.sh configs/qwen3.5-27b-gptq-int4.yaml
# Note: GPTQ requires float16

model: Qwen/Qwen3.5-27B-GPTQ-Int4
served-model-name: Qwen/Qwen3.5-27B-GPTQ-Int4
# max-model-len: 262144
max-model-len: 16384
max-num-seqs: 1
gpu-memory-utilization: 0.99
quantization: gptq_marlin
dtype: float16
kv-cache-dtype: fp8
tensor-parallel-size: 1
trust-remote-code: true
#enforce-eager: true
language-model-only: true
reasoning-parser: qwen3
override-generation-config:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
