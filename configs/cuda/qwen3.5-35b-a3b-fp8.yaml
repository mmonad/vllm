# Qwen3.5-35B-A3B (FP8) — hybrid DeltaNet/attention MoE, 3B active
# Usage: ./run-vllm.sh configs/cuda/qwen3.5-35b-a3b-fp8.yaml
# Hardware: RTX Pro 6000 (96GB) — FP8 weights + FP8 KV-cache

model: Qwen/Qwen3.5-35B-A3B-FP8
served-model-name: Qwen/Qwen3.5-35B-A3B-FP8
max-model-len: 262144
gpu-memory-utilization: 0.49
dtype: bfloat16
kv-cache-dtype: fp8
tensor-parallel-size: 1
trust-remote-code: true
reasoning-parser: qwen3
override-generation-config:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
